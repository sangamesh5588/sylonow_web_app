<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Workaround for "Cannot set property fetch of #<Window> which has only a getter" error
      // caused by some external scripts or extensions trying to override fetch.
      (function() {
        try {
          const descriptor = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                             Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          
          if (descriptor && descriptor.get && !descriptor.set) {
            const originalFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              value: originalFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Silently fail if we can't redefine fetch
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
